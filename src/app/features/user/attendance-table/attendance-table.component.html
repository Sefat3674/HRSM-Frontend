<div class="dashboard-bg">
  <div class="full-table-wrapper">

    <!-- Header -->
    <div class="table-header d-flex justify-content-between align-items-center">
      <h2>
        <i class="bi bi-calendar3 me-2"></i>
        Attendance
      </h2>

      <!-- Month Filter -->
      <div class="search-box">
        <input
          type="month"
          [(ngModel)]="selectedMonth"
          (change)="filterByMonth()"
          class="form-control"
        />
      </div>
    </div>

    <!-- Search -->
    <div class="my-2">
      <input
        type="text"
        [(ngModel)]="searchTerm"
        (input)="onSearch()"
        class="form-control"
        placeholder="Search..."
      />
    </div>

    <!-- Table -->
    <div class="table-responsive" *ngIf="calendarDays.length">
      <table class="table table-modern table-striped">
        <thead>
          <tr>
            <th>Date</th>
            <th>Day</th>
            <th>Check-In</th>
            <th>Check-Out</th>
            <th>Status</th>
          </tr>
        </thead>

        <tbody>
                  <tr *ngFor="let record of calendarDays" [style.background-color]="getRowColor(record)">
          <td>{{ record.date | date:'dd MMMM yyyy' }}</td>
          <td>{{ record.date | date:'EEEE' }}</td>

          <td [ngClass]="{ 'late-text': record.checkInTime && isLate(record.checkInTime) }">
  {{ convertToAmPm(record.checkInTime) }}
</td>

<td [ngClass]="{ 'early-text': record.checkOutTime && isEarly(record.checkOutTime) }">
  {{ convertToAmPm(record.checkOutTime) }}
</td>

          <td>
            <span
              class="badge-custom"
              [ngClass]="{
                'present': record.status === 'Present',
                'absent': record.status === 'Absent',
                'late': record.status === 'Late',
                'no-data': !record.status
              }"
            >
              {{ record.status ? record.status : 'N/A' }}
            </span>
          </td>
        </tr>
        </tbody>
      </table>
    </div>

    <div *ngIf="!calendarDays.length && !loading" class="text-center text-muted my-3">
      No attendance records found.
    </div>

  </div>
</div>
